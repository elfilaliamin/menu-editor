<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Menu Builder — Create Beautiful Restaurant Menus</title>
  <meta name="description" content="Professional digital menu builder for restaurants and cafés. Create, customize, and export beautiful menus for GitHub Pages hosting." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/editor.css" />
  <link rel="stylesheet" href="css/preview.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body class="app-root" id="app-root">

  <!-- App Loading Screen -->
  <div id="app-loading" class="app-loading">
    <div class="loading-content">
      <div class="loading-logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="12" fill="url(#grad1)"/>
          <path d="M12 16h24M12 24h18M12 32h12" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="36" cy="32" r="6" fill="white" fill-opacity="0.9"/>
          <defs>
            <linearGradient id="grad1" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6366f1"/>
              <stop offset="1" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <p class="loading-text">Digital Menu Builder</p>
      <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" role="alert" aria-live="polite"></div>

  <!-- Mobile sidebar overlay -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div id="modal-content" class="modal-content"></div>
  </div>

  <!-- Main App Shell -->
  <div id="app" class="app hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg width="32" height="32" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="10" fill="url(#sgrad)"/>
            <path d="M12 16h24M12 24h18M12 32h12" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="36" cy="32" r="6" fill="white" fill-opacity="0.9"/>
            <defs>
              <linearGradient id="sgrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="sidebar-logo-text">MenuBuilder</span>
        </div>
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
      </div>

      <!-- Project selector -->
      <div class="sidebar-project" id="sidebar-project-selector">
        <div class="project-selector-label">Current Project</div>
        <div class="project-selector-name" id="current-project-name">My Menu</div>
        <div class="project-selector-actions">
          <button class="btn-icon" id="btn-save-project" title="Save"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></button>
          <span id="save-status" class="save-status">Saved</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Editor</div>
        <button class="nav-item active" data-panel="restaurant" id="nav-restaurant">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>Restaurant Info</span>
        </button>
        <button class="nav-item" data-panel="sections" id="nav-sections">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          <span>Sections & Items</span>
          <span class="nav-badge" id="sections-count">0</span>
        </button>
        <button class="nav-item" data-panel="appearance" id="nav-appearance">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
          <span>Appearance</span>
        </button>
        <button class="nav-item" data-panel="settings" id="nav-settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M5.63 5.63a10 10 0 0 0 0 12.74M22 12h-2M4 12H2M12 22v-2M12 4V2"/></svg>
          <span>Menu Settings</span>
        </button>

        <div class="nav-section-label" style="margin-top: 8px;">Publish</div>
        <button class="nav-item" data-panel="qrcode" id="nav-qrcode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/><rect x="19" y="14" width="2" height="2"/><rect x="14" y="19" width="2" height="2"/><rect x="19" y="19" width="2" height="2"/></svg>
          <span>QR Code</span>
        </button>
        <button class="nav-item" data-panel="export" id="nav-export">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Export</span>
        </button>

        <div class="nav-section-label" style="margin-top: 8px;">Projects</div>
        <button class="nav-item" data-panel="projects" id="nav-projects">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span>My Projects</span>
        </button>
      </nav>

      <!-- Undo/Redo -->
      <div class="sidebar-footer">
        <div class="undo-redo">
          <button id="btn-undo" class="btn-icon-sm" title="Undo (Ctrl+Z)" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
          </button>
          <button id="btn-redo" class="btn-icon-sm" title="Redo (Ctrl+Y)" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
          </button>
        </div>
        <div class="sidebar-version">v1.0.0</div>
      </div>
    </aside>

    <!-- Main Editor Area -->
    <main class="editor-main" id="editor-main">
      <!-- Editor Top Bar -->
      <header class="editor-topbar">
        <div class="topbar-left">
          <button id="mobile-menu-btn" class="btn-icon mobile-only" aria-label="Open menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <div class="breadcrumb">
            <span class="breadcrumb-project" id="bc-project">My Menu</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            <span class="breadcrumb-panel" id="bc-panel">Restaurant Info</span>
          </div>
        </div>
        <div class="topbar-right">
          <div class="preview-mode-switcher" id="preview-mode-switcher">
            <button class="preview-mode-btn" data-mode="mobile" title="Mobile preview">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            </button>
            <button class="preview-mode-btn" data-mode="tablet" title="Tablet preview">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            </button>
            <button class="preview-mode-btn active" data-mode="desktop" title="Desktop preview">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            </button>
          </div>
          <button id="btn-export-quick" class="btn-primary btn-sm">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export ZIP
          </button>
        </div>
      </header>

      <!-- Mobile Tab Switcher -->
      <div class="mobile-tabs mobile-only" id="mobile-tabs">
        <button class="mobile-tab active" data-target="editor-panel">Editor</button>
        <button class="mobile-tab" data-target="preview-panel">Preview</button>
      </div>

      <div class="editor-body">
        <!-- Editor Panel -->
        <div class="editor-panel" id="editor-panel">
          <!-- Panels loaded dynamically -->
          <div id="panel-restaurant" class="panel active"></div>
          <div id="panel-sections" class="panel"></div>
          <div id="panel-appearance" class="panel"></div>
          <div id="panel-settings" class="panel"></div>
          <div id="panel-qrcode" class="panel"></div>
          <div id="panel-export" class="panel"></div>
          <div id="panel-projects" class="panel"></div>
        </div>

        <!-- Preview Panel -->
        <div class="preview-panel" id="preview-panel">
          <div class="preview-frame-wrapper" id="preview-frame-wrapper">
            <div class="preview-device" id="preview-device" data-mode="desktop">
              <div class="preview-device-bar desktop-only-bar"></div>
              <div class="preview-refresh" id="preview-refresh">Updating...</div>
              <div id="preview-viewport" class="preview-viewport"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- JS Modules -->
  <script src="js/utils/id.js"></script>
  <script src="js/utils/validators.js"></script>
  <script src="js/utils/imageUtils.js"></script>
  <script src="js/data/demoData.js"></script>
  <script src="js/data/themes.js"></script>
  <script src="js/state/store.js"></script>
  <script src="js/state/undoRedo.js"></script>
  <script src="js/state/autoSave.js"></script>
  <script src="js/state/projects.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/imagePicker.js"></script>
  <script src="js/components/dragDrop.js"></script>
  <script src="js/panels/restaurantPanel.js"></script>
  <script src="js/panels/sectionsPanel.js"></script>
  <script src="js/panels/appearancePanel.js"></script>
  <script src="js/panels/settingsPanel.js"></script>
  <script src="js/panels/qrPanel.js"></script>
  <script src="js/panels/exportPanel.js"></script>
  <script src="js/panels/projectsPanel.js"></script>
  <script src="js/export/menuRenderer.js"></script>
  <script src="js/export/htmlExporter.js"></script>
  <script src="js/export/zipExporter.js"></script>
  <script src="js/services/githubPublisher.js"></script>
  <script src="js/preview/previewEngine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
